# The Outis prover: a Starknet transaction proved where its private inputs are, natively or in a
# browser (wasm32). Built on StarkWare's sequencer and prover, through Outis's forks of both:
# - sequencer: github.com/outis-wallet/sequencer, branch outis (PRIVACY-0.14.4-RC.0 + wasm32 fixes)
# - proving:   github.com/outis-wallet/proving, branch outis (2b495a36 + the striped prover)
[workspace]
resolver = "2"
members = ["crates/os_wasm_probe"]
exclude = ["wasm-stubs"]

[workspace.dependencies]
# The sequencer's crates, from the fork.
blockifier = { path = "../sequencer/crates/blockifier" }
shared_execution_objects = { path = "../sequencer/crates/shared_execution_objects" }
starknet_api = { path = "../sequencer/crates/starknet_api" }
starknet_committer = { path = "../sequencer/crates/starknet_committer" }
starknet_os = { path = "../sequencer/crates/starknet_os" }
starknet_patricia = { path = "../sequencer/crates/starknet_patricia" }
starknet_patricia_storage = { path = "../sequencer/crates/starknet_patricia_storage" }
starknet_proof_verifier = { path = "../sequencer/crates/starknet_proof_verifier" }
# The prover, as the sequencer depends on it; [patch] below swaps in the fork.
privacy-prove = { git = "https://github.com/starkware-libs/proving", rev = "2b495a36d57a4bd754cdfa1c2b5bda8d92b37ec3" }
# The rest, at the sequencer's versions.
cairo-lang-starknet-classes = "2.19.4"
cairo-lang-utils = "2.19.4"
cairo-vm = "3.2.0"
futures = "0.3.21"
indexmap = "2.1.0"
serde = "1.0.197"
serde_json = "1.0.116"
sha2 = "0.10.8"
starknet-rust-core = "0.16.0"
starknet-types-core = "0.2.4"
thiserror = "1.0.37"
tokio = "1.52.3"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"

# c-kzg is a C library with no wasm32 build; the proving path never calls it.
[patch.crates-io]
c-kzg = { path = "wasm-stubs/c-kzg" }

[patch."https://github.com/starkware-libs/proving"]
cairo-air = { path = "../proving/crates/cairo-air" }
cairo-program-runner-lib = { path = "../proving/crates/cairo-program-runner-lib" }
circuit-cairo-verifier = { path = "../proving/crates/cairo_verifier" }
circuit-common = { path = "../proving/crates/circuit_common" }
circuit-prover = { path = "../proving/crates/circuit_prover" }
circuit-registry = { path = "../proving/crates/circuit_registry" }
circuit-serialize = { path = "../proving/crates/circuit_serialize" }
circuit-verifier = { path = "../proving/crates/circuit_verifier" }
circuits = { path = "../proving/crates/circuits" }
circuits-stark-verifier = { path = "../proving/crates/stark_verifier" }
leaf-proof-format = { path = "../proving/crates/leaf_proof_format" }
leaf-prover = { path = "../proving/crates/leaf_prover" }
privacy-circuit-verify = { path = "../proving/crates/privacy_circuit_verify" }
privacy-prove = { path = "../proving/crates/privacy_prove" }
stwo = { path = "../proving/crates/stwo" }
stwo-air-utils = { path = "../proving/crates/air-utils" }
stwo-air-utils-derive = { path = "../proving/crates/air-utils-derive" }
stwo-cairo-adapter = { path = "../proving/crates/adapter" }
stwo-cairo-common = { path = "../proving/crates/common" }
stwo-cairo-prover = { path = "../proving/crates/prover" }
stwo-cairo-serialize = { path = "../proving/crates/cairo-serialize" }
stwo-cairo-serialize-derive = { path = "../proving/crates/cairo-serialize-derive" }
stwo-cairo-utils = { path = "../proving/crates/utils" }
stwo-constraint-framework = { path = "../proving/crates/constraint-framework" }

