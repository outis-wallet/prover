leaf-proof-format = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
leaf-prover = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
privacy-circuit-verify = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
privacy_common = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
privacy-prove = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
stwo = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
stwo-air-utils = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
stwo-air-utils-derive = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
stwo-cairo-adapter = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
