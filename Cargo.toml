# The Outis prover: a Starknet transaction proved where its private inputs are, natively or in a
# browser (wasm32). Built on StarkWare's sequencer and prover, through Outis's forks of both:
# - sequencer: github.com/outis-wallet/sequencer, branch outis (PRIVACY-0.14.4-RC.0 + wasm32 fixes)
# - proving:   github.com/outis-wallet/proving, branch outis (2b495a36 + the striped prover);
#              pinned to its gpu branch (the GPU commitment natively and in browsers, feature gpu)
[workspace]
resolver = "2"
members = ["crates/os_wasm_probe"]
exclude = ["wasm-stubs"]

[workspace.dependencies]
# The sequencer's crates, from the fork.
blockifier = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
shared_execution_objects = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
starknet_api = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
starknet_committer = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
starknet_os = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
starknet_patricia = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
starknet_patricia_storage = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
starknet_proof_verifier = { git = "https://github.com/outis-wallet/sequencer", rev = "845e2146180de5f2d2aa8212504616c6f35eedd0" }
# The prover, as the sequencer depends on it; [patch] below swaps in the fork.
privacy-prove = { git = "https://github.com/starkware-libs/proving", rev = "2b495a36d57a4bd754cdfa1c2b5bda8d92b37ec3" }
stwo = { git = "https://github.com/starkware-libs/proving", rev = "2b495a36d57a4bd754cdfa1c2b5bda8d92b37ec3" }
# The striped commitment on a GPU (the prover's `gpu` feature), from the fork: natively through
# wgpu, and in browsers the bridge to a page's WebGPU worker (no dependencies).
stwo-gpu-spike = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
stwo-gpu-bridge = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
# The rest, at the sequencer's versions.
cairo-lang-starknet-classes = "2.19.4"
cairo-lang-utils = "2.19.4"
cairo-vm = "3.2.0"
futures = "0.3.21"
indexmap = "2.1.0"
serde = "1.0.197"
serde_json = "1.0.116"
sha2 = "0.10.8"
starknet-rust-core = "0.16.0"
starknet-types-core = "0.2.4"
thiserror = "1.0.37"
tokio = "1.52.3"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"

# c-kzg is a C library with no wasm32 build; the proving path never calls it.
[patch.crates-io]
c-kzg = { path = "wasm-stubs/c-kzg" }

[patch."https://github.com/starkware-libs/proving"]
cairo-air = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
cairo-program-runner-lib = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
