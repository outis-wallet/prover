privacy-circuit-verify = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
privacy-prove = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
stwo = { git = "https://github.com/outis-wallet/proving", rev = "207fb54b1e4cb0910758724cd32c0f3e0ad4f0ae" }
