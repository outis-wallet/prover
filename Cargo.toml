# The Outis prover: a Starknet transaction proved where its private inputs are, natively or in a
# browser (wasm32). Built on StarkWare's sequencer and prover, through Outis's forks of both:
# - sequencer: github.com/outis-wallet/sequencer, tag outis-v0.3.0 (main-v0.14.4 at 148de445, whose
#              proving revision Sepolia verifies, + wasm32 fixes)
# - proving:   github.com/outis-wallet/proving, tag outis-v0.3.1 (e0035ffc + the striped prover and
#              the GPU commitment natively and in browsers, feature gpu)
[workspace]
resolver = "2"
members = ["crates/os_wasm_probe"]
exclude = ["wasm-stubs"]

[workspace.dependencies]
# The sequencer's crates, from the fork.
blockifier = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
shared_execution_objects = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
starknet_api = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
starknet_committer = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
starknet_os = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
starknet_patricia = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
starknet_patricia_storage = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
starknet_proof_verifier = { git = "https://github.com/outis-wallet/sequencer", rev = "b60d91175d2e81439772cb2c09fc1eccf61d5990" }
# The prover, as the sequencer depends on it; [patch] below swaps in the fork.
privacy-prove = { git = "https://github.com/starkware-libs/proving", rev = "e0035ffc8e08da270b8cb4a71f3708af70c2c775" }
stwo = { git = "https://github.com/starkware-libs/proving", rev = "e0035ffc8e08da270b8cb4a71f3708af70c2c775" }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/proving", rev = "e0035ffc8e08da270b8cb4a71f3708af70c2c775" }
# The striped commitment on a GPU (the prover's `gpu` feature), from the fork: natively through
# wgpu, and in browsers the bridge to a page's WebGPU worker (no dependencies).
stwo-gpu-spike = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
stwo-gpu-bridge = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
# The rest, at the sequencer's versions.
cairo-lang-starknet-classes = "2.19.6"
cairo-lang-utils = "2.19.6"
cairo-vm = "3.2.0"
futures = "0.3.21"
indexmap = "2.1.0"
serde = "1.0.197"
serde_json = "1.0.116"
sha2 = "0.10.8"
starknet-rust-core = "0.16.0"
starknet-types-core = "0.2.4"
thiserror = "1.0.37"
tokio = "1.52.3"
tracing = "0.1.37"
tracing-subscriber = "0.3.16"

# c-kzg is a C library with no wasm32 build; the proving path never calls it.
[patch.crates-io]
c-kzg = { path = "wasm-stubs/c-kzg" }

[patch."https://github.com/starkware-libs/proving"]
cairo-air = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
cairo-program-runner-lib = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
circuit-cairo-verifier = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
circuit-common = { git = "https://github.com/outis-wallet/proving", rev = "8e5804afdc0f3453436f291f6e8a04604c3484a3" }
