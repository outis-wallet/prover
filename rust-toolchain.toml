[toolchain]
# Nightly for the threaded wasm build (-Z build-std); native builds use it too.
channel = "nightly-2026-01-15"
components = ["rust-src"]
# wasm32 for browsers; the iOS and Android targets for the Outis Prover apps' static libraries.
targets = ["wasm32-unknown-unknown", "aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-linux-android"]
